<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <title>标书哨兵 · 产品介绍视频</title>
    <style>
      :root {
        color-scheme: light;
        --blue: #2563eb;
        --blue-soft: #eff6ff;
        --ink: #0f172a;
        --muted: #475569;
        --line: #dbeafe;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 32px 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 0%, #dbeafe 0%, transparent 42%),
          linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
        color: var(--ink);
        font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
      }
      .card {
        width: min(1180px, 100%);
        padding: 30px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 30px 90px rgba(37, 99, 235, 0.14);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .logo {
        width: 54px;
        height: 54px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        border-radius: 17px;
        background: var(--blue);
        color: #fff;
        font-size: 27px;
        font-weight: 700;
        box-shadow: 0 12px 30px rgba(37, 99, 235, 0.3);
      }
      h1 {
        margin: 0;
        font-size: clamp(22px, 3vw, 32px);
        letter-spacing: 0.04em;
      }
      .subtitle {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
      }
      video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        margin-top: 24px;
        border-radius: 18px;
        background: #020617;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.16);
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 16px;
        color: #64748b;
        font-size: 13px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--blue-soft);
        color: var(--blue);
        font-weight: 600;
      }
      a {
        color: var(--blue);
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        text-decoration: underline;
      }
      .screenshots {
        margin-top: 34px;
        padding-top: 26px;
        border-top: 1px solid var(--line);
      }
      .section-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }
      .section-heading h2 {
        margin: 0;
        font-size: clamp(19px, 2.2vw, 24px);
        letter-spacing: 0.02em;
      }
      .section-heading p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }
      .shot {
        margin: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      }
      .shot img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        background: #f8fafc;
      }
      .shot figcaption {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 12px 14px 14px;
      }
      .shot figcaption strong {
        font-size: 14px;
      }
      .shot figcaption span {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      @media (max-width: 780px) {
        .section-heading {
          display: block;
        }
        .section-heading p {
          margin-top: 6px;
        }
        .gallery {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 640px) {
        body {
          padding: 16px 10px;
        }
        .card {
          padding: 18px;
          border-radius: 20px;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <div class="logo" aria-hidden="true">哨</div>
        <div>
          <h1>标书哨兵 · 产品介绍</h1>
          <p class="subtitle">多 Agent 标书编写系统 · 从解析、编写到审核交付</p>
        </div>
      </div>

      <video
        controls
        preload="metadata"
        playsinline
        poster="biaoshu-shaobing-product-intro-poster.jpg"
      >
        <source
          src="biaoshu-shaobing-product-intro-1080p.mp4"
          type="video/mp4"
        />
        你的浏览器不支持 HTML5 视频，请
        <a href="biaoshu-shaobing-product-intro-1080p.mp4">下载 MP4</a>。
      </video>

      <div class="meta">
        <span class="badge">1080P · 60 秒 · 中文男声旁白</span>
        <span>登录 · 文档库 · 编写大纲 · 企业资质 · 检索 · 门禁合规 · 审计</span>
        <a href="biaoshu-shaobing-product-intro-1080p.mp4" download>下载 MP4</a>
      </div>

      <section class="screenshots" aria-labelledby="screenshots-title">
        <div class="section-heading">
          <h2 id="screenshots-title">产品前端界面</h2>
          <p>同一演示环境的实际界面，使用合成演示数据</p>
        </div>
        <div class="gallery">
          <figure class="shot">
            <img src="screenshots/login.jpg" alt="登录工作台" />
            <figcaption>
              <strong>登录工作台</strong>
              <span>本地账号登录、可撤销会话与项目上下文</span>
            </figcaption>
          </figure>
          <figure class="shot">
            <img
              src="screenshots/document-library.jpg"
              alt="文档库" />
            <figcaption>
              <strong>文档库</strong>
              <span>解析产物、页数/文本块/目录项与附件证据</span>
            </figcaption>
          </figure>
          <figure class="shot">
            <img
              src="screenshots/bid-outline.jpg"
              alt="编写标书与大纲编辑" />
            <figcaption>
              <strong>编写标书</strong>
              <span>可编辑大纲、目标字数、编写要点与写作重点</span>
            </figcaption>
          </figure>
          <figure class="shot">
            <img
              src="screenshots/company-qualifications.jpg"
              alt="企业资质库" />
            <figcaption>
              <strong>企业资质</strong>
              <span>资质证书、发证/到期日期与到期提醒</span>
            </figcaption>
          </figure>
          <figure class="shot">
            <img
              src="screenshots/document-search.jpg"
              alt="文档检索" />
            <figcaption>
              <strong>文档检索</strong>
              <span>语义优先、关键词回退，展示章节/页码/相关度</span>
            </figcaption>
          </figure>
          <figure class="shot">
            <img
              src="screenshots/audit-log.jpg"
              alt="审计日志" />
            <figcaption>
              <strong>审计日志</strong>
              <span>SHA-256 哈希链、筛选、校验与 CSV 导出</span>
            </figcaption>
          </figure>
        </div>
      </section>
    </main>
  </body>
</html>
