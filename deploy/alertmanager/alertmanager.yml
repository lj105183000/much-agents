route:
  receiver: default
  group_by: [alertname]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    # Placeholder sink. Replace this URL with your webhook, or replace the
    # receiver with email_configs/slack_configs for your environment.
    webhook_configs:
      - url: http://host.docker.internal:9099/alerts
        send_resolved: true
