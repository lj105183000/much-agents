groups:
  - name: much-agents
    rules:
      - alert: MuchAgentsApi5xxRate
        expr: |
          sum(rate(much_agents_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(much_agents_http_requests_total[5m])), 1)
          > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Much Agents API 5xx rate above 5%"
          description: "Check API logs and dependencies (DB/Redis/MinIO/Chroma)."

      - alert: MuchAgentsReadinessDegraded
        expr: min_over_time(much_agents_ready_checks[2m]) == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Much Agents readiness check is failing"
          description: "Inspect GET /api/ready and the failing component."

      - alert: MuchAgentsLlmErrorRate
        expr: |
          sum(rate(much_agents_llm_calls_total{status="error"}[10m]))
          /
          clamp_min(sum(rate(much_agents_llm_calls_total[10m])), 1)
          > 0.10
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Much Agents LLM error rate above 10%"
          description: "Check provider status, budget and model configuration."

      - alert: MuchAgentsQueueBacklog
        expr: max_over_time(much_agents_queue_depth[10m]) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Much Agents Celery queue backlog"
          description: "A parse/bid/maintenance queue has more than five pending jobs."

      - alert: MuchAgentsDailyCostBudgetWarning
        # Replace 100 with the daily LLM budget for this deployment.
        expr: increase(much_agents_llm_cost_cny_total[24h]) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Daily LLM cost exceeds the warning budget"
          description: "24h LLM cost is above 100 CNY; review project/run budgets."

      - alert: MuchAgentsDailyCostBudgetExceeded
        # Replace 500 with the hard daily LLM budget for this deployment.
        expr: increase(much_agents_llm_cost_cny_total[24h]) > 500
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Daily LLM cost exceeds the hard budget"
          description: "24h LLM cost is above 500 CNY; pause non-critical generation."

      - alert: MuchAgentsBackupStale
        expr: time() - max(much_agents_backup_last_success_timestamp_seconds) > 93600
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Much Agents backup is older than 26 hours"
          description: "Check scripts/backup.sh and the systemd timer."

      - alert: MuchAgentsBackupMetricMissing
        expr: absent_over_time(much_agents_backup_last_success_timestamp_seconds[26h])
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Much Agents backup success metric is missing"
          description: "Set BACKUP_METRICS_DIR and expose it to Prometheus via node_exporter textfile."
