global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: much-agents-api
    metrics_path: /api/metrics
    # The monitoring compose command writes METRICS_TOKEN here (empty when
    # the API does not require a token).
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ["api:8001"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
