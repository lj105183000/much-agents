name: eval-nightly

# Opt-in regression on a self-hosted runner that has the private eval dataset:
#   EVAL_DATA_DIR, EVAL_BIDS_DIR, EVAL_BASELINE
# and repository secrets DEEPSEEK_API_KEY/ZHIPU_API_KEY.
# Enable with repository variable EVAL_NIGHTLY_ENABLED=true.
#
# EVAL_SECTIONS (default 1) must match the section count used to build the
# baseline. Manual dispatch can set refresh_baseline=true to rebuild the
# baseline from the current runs and skip comparison; a missing or incomplete
# baseline is bootstrapped automatically on the first run.
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      refresh_baseline:
        description: "Rebuild EVAL_BASELINE from the current runs and skip comparison"
        type: boolean
        default: false
      sections:
        description: "Narrative sections per eval case (must match the baseline)"
        type: number
        default: 1

permissions:
  contents: read

jobs:
  regression:
    if: ${{ vars.EVAL_NIGHTLY_ENABLED == 'true' }}
    runs-on: [self-hosted, eval]
    defaults:
      run:
        shell: bash
    env:
      EVAL_SECTIONS: ${{ github.event.inputs.sections || vars.EVAL_SECTIONS || '1' }}
      REFRESH_BASELINE: ${{ github.event.inputs.refresh_baseline == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
          enable-cache: true
      - run: uv sync --frozen
      - name: Check runner eval paths
        run: |
          : "${EVAL_DATA_DIR:?EVAL_DATA_DIR is required}"
          : "${EVAL_BIDS_DIR:?EVAL_BIDS_DIR is required}"
          : "${EVAL_BASELINE:?EVAL_BASELINE is required}"
          case "${EVAL_SECTIONS:-1}" in
            ''|*[!0-9]*) echo "EVAL_SECTIONS must be a positive integer"; exit 2 ;;
          esac
          if [ "${EVAL_SECTIONS:-1}" -lt 1 ]; then
            echo "EVAL_SECTIONS must be >= 1"; exit 2
          fi
      - name: Validate private eval dataset
        run: |
          uv run python -m scripts.eval_dataset validate --data-dir "$EVAL_DATA_DIR"
      - name: Generate one small run per eval case
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          uv run python -m scripts.eval_generate \
            --data-dir "$EVAL_DATA_DIR" \
            --bids-dir "$EVAL_BIDS_DIR" \
            --max-sections "$EVAL_SECTIONS"
      - name: Check baseline
        id: baseline
        if: ${{ env.REFRESH_BASELINE != 'true' }}
        run: |
          if uv run python -m scripts.eval_regression \
               --check-baseline --require-l1 \
               --baseline "$EVAL_BASELINE"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Baseline is missing or incomplete; it will be initialized."
          fi
      - name: Refresh baseline (manual)
        if: ${{ env.REFRESH_BASELINE == 'true' }}
        run: |
          uv run python -m scripts.eval_regression \
            --data-dir "$EVAL_DATA_DIR" \
            --bids-dir "$EVAL_BIDS_DIR" \
            --baseline "$EVAL_BASELINE" \
            --update-baseline \
            --require-l1
          cp "$EVAL_BASELINE" "$RUNNER_TEMP/eval-baseline.json"
      - name: Bootstrap baseline
        if: ${{ env.REFRESH_BASELINE != 'true' && steps.baseline.outputs.ready != 'true' }}
        run: |
          uv run python -m scripts.eval_regression \
            --data-dir "$EVAL_DATA_DIR" \
            --bids-dir "$EVAL_BIDS_DIR" \
            --baseline "$EVAL_BASELINE" \
            --update-baseline \
            --require-l1
          cp "$EVAL_BASELINE" "$RUNNER_TEMP/eval-baseline.json"
          echo "Baseline initialized from the current runs; the next nightly run will compare."
      - name: Compare against baseline
        if: ${{ env.REFRESH_BASELINE != 'true' && steps.baseline.outputs.ready == 'true' }}
        run: |
          uv run python -m scripts.eval_regression \
            --data-dir "$EVAL_DATA_DIR" \
            --bids-dir "$EVAL_BIDS_DIR" \
            --baseline "$EVAL_BASELINE" \
            --require-baseline \
            --output "$RUNNER_TEMP/regression.json"
      - name: Upload regression report
        if: ${{ always() && env.REFRESH_BASELINE != 'true' && steps.baseline.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: eval-regression
          path: ${{ runner.temp }}/regression.json
          if-no-files-found: warn
      - name: Upload baseline
        if: ${{ always() && (env.REFRESH_BASELINE == 'true' || steps.baseline.outputs.ready != 'true') }}
        uses: actions/upload-artifact@v7
        with:
          name: eval-baseline
          path: ${{ runner.temp }}/eval-baseline.json
          if-no-files-found: warn

  benchmark:
    # Budget-capped real-LLM latency/token/cost benchmark.
    # Enable with repository variable LLM_BENCHMARK_ENABLED=true and secrets
    # DEEPSEEK_API_KEY + LLM_PRICE_TABLE. Set BENCHMARK_BASELINE to a report
    # path on the runner (or download a previous artifact) to gate regressions.
    if: ${{ vars.LLM_BENCHMARK_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
          enable-cache: true
      - run: uv sync --frozen
      - name: Run budget-capped LLM benchmark
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_PRICE_TABLE: ${{ secrets.LLM_PRICE_TABLE }}
          BENCHMARK_BASELINE: ${{ vars.BENCHMARK_BASELINE }}
          BENCHMARK_MAX_COST_CNY: ${{ vars.BENCHMARK_MAX_COST_CNY }}
        run: |
          args=(
            --max-cost-cny "${BENCHMARK_MAX_COST_CNY:-0.5}"
            --output "$RUNNER_TEMP/llm-benchmark.json"
          )
          if [ -n "$BENCHMARK_BASELINE" ]; then
            args+=(--baseline "$BENCHMARK_BASELINE")
          fi
          uv run python -m scripts.eval_benchmark "${args[@]}"
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: llm-benchmark
          path: ${{ runner.temp }}/llm-benchmark.json
