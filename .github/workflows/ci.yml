name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.12"
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - run: uv sync --frozen
      - name: Install CJK font for figure tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei
      - run: uv run ruff check .
      - run: uv run pytest
      - name: L0 rule baseline
        run: |
          uv run python -m scripts.eval_rule_baseline check \
            --fixtures tests/eval/fixtures/l0 \
            --baseline tests/eval/fixtures/l0/baseline.json

  migrations:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: much_agents
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: much_agents
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U much_agents -d much_agents"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://much_agents:ci_password@127.0.0.1:5432/much_agents
      DB_AUTO_MIGRATE: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.12"
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade -1
      - run: uv run alembic upgrade head
      - run: uv run alembic current
      - run: uv run pytest tests/test_repository_integration.py -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://much_agents:ci_password@127.0.0.1:5432/much_agents

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: much_agents
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: much_agents
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U much_agents -d much_agents"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql+asyncpg://much_agents:ci_password@127.0.0.1:5432/much_agents_e2e
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.12"
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run browser E2E and the read-only load probe
        run: |
          uv run python scripts/run_e2e.py \
            --database-url "$E2E_DATABASE_URL" \
            --load-test \
            --load-duration 10 \
            --load-concurrency 8 \
            --load-max-p95-ms 2000 \
            --load-sse-connections 4 \
            --load-sse-seconds 5
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          if-no-files-found: ignore
          path: |
            frontend/playwright-report
            frontend/test-results
            .e2e/logs

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Prepare production env and TLS placeholders
        run: |
          cp deploy/env.production.example deploy/env.production
          ./deploy/nginx/generate-self-signed.sh localhost
      - name: Validate compose file
        run: docker compose -f docker-compose.prod.yml config > /dev/null
      - name: Check production images are pinned
        run: python3 scripts/check_image_pins.py docker-compose.prod.yml
      - name: Build API image
        run: docker build --target api -t much-agents-api:ci .
      - name: Build web image
        run: docker build --target web -t much-agents-web:ci .
      - name: Scan API image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: much-agents-api:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Report-only until the baseline is triaged; tighten to 1 afterwards.
          exit-code: "0"
      - name: Scan web image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: much-agents-web:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Scan repository configuration (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,config
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Generate API SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          image: much-agents-api:ci
          format: spdx-json
          artifact-name: much-agents-api-sbom.spdx.json
      - name: Generate web SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          image: much-agents-web:ci
          format: spdx-json
          artifact-name: much-agents-web-sbom.spdx.json
      - name: Install cosign (optional)
        if: ${{ vars.CI_SIGN_IMAGES == 'true' }}
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign API image (optional)
        if: ${{ vars.CI_SIGN_IMAGES == 'true' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY much-agents-api:ci
      - name: Sign web image (optional)
        if: ${{ vars.CI_SIGN_IMAGES == 'true' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY much-agents-web:ci
      - name: Verify license files in images
        run: |
          docker run --rm --entrypoint sh much-agents-api:ci \
            -c 'test -s /app/LICENSE && test -s /app/NOTICE && test -s /app/THIRD_PARTY_NOTICES.md'
          docker run --rm --entrypoint sh much-agents-web:ci \
            -c 'test -s /usr/share/nginx/html/LICENSE && test -s /usr/share/nginx/html/NOTICE && test -s /usr/share/nginx/html/THIRD_PARTY_NOTICES.md'
      - name: Validate Nginx configuration
        run: |
          docker run --rm --add-host api:127.0.0.1 \
            -v "$PWD/deploy/nginx/certs:/etc/nginx/certs:ro" \
            much-agents-web:ci nginx -t

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.12"
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Python dependency audit
        # chromadb 1.5.9 (latest) has four unfixed server-side advisories; our usage is
        # client-only and Chroma is not published outside the Compose network. See
        # docs/dependency-security.md. Keep this list scoped to those GHSA IDs and remove
        # the exceptions as soon as upstream ships a fix.
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt \
            > "$RUNNER_TEMP/requirements.txt"
          uvx --from pip-audit pip-audit -r "$RUNNER_TEMP/requirements.txt" \
            --ignore-vuln GHSA-f4j7-r4q5-qw2c \
            --ignore-vuln GHSA-2wm9-hf6c-p5cr \
            --ignore-vuln GHSA-36p7-vc44-83pf \
            --ignore-vuln GHSA-xph7-9rjv-w5fr
