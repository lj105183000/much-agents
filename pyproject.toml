[project]
name = "much-agents"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "celery>=5.6.3",
    "chromadb>=1.5.9",
    "fastapi>=0.159.1",
    "langgraph>=1.2.16",
    "openai>=3.36.1",
    "pymupdf>=2.0",
    "python-docx>=1.2.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.54.0",
    "zai-sdk>=0.2.3",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
