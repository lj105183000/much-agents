[project]
name = "much-agents"
version = "0.1.0"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "celery>=5.6.3",
    "chromadb>=1.5.9",
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.16",
    "markdown-it-py>=4.2.0",
    "mcp>=1.20,<2",
    "minio>=7.2.20",
    "openai>=3.36.1",
    "pillow>=11",
    "pydantic>=2.14.1",
    "pymupdf>=2.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.20",
    "redis>=8.1.0",
    "sqlalchemy>=2.0,<2.1",
    "tenacity>=9.1.1",
    "uvicorn[standard]>=0.54.0",
    "zai-sdk>=0.2.3",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Keep CI focused on real defects; formatting is not enforced yet.
select = ["E9", "F63", "F7", "F82"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.8",
]
