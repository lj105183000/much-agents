name: much-agents-prod

# Production topology for a single-host internal deployment.
# Only Nginx publishes ports; everything else stays on the private network.
# Required once before `docker compose ... up`:
#   cp deploy/env.production.example deploy/env.production   # then edit
#   ./deploy/nginx/generate-self-signed.sh <host-or-ip>

x-app-env: &app-env
  env_file:
    - ./deploy/env.production

x-app-build: &app-build
  context: .
  args:
    # Optional mirrors for restricted networks; override at build time, e.g.
    #   APT_MIRROR=mirrors.aliyun.com docker compose ... build
    APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
    PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}

x-app-service: &app-service
  env_file:
    - ./deploy/env.production
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=1g,mode=1777
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./deploy/env.production
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - ./deploy/env.production
    command:
      - sh
      - -c
      - >-
        exec redis-server --requirepass "$$REDIS_PASSWORD"
        --appendonly yes --save 60 1
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    env_file:
      - ./deploy/env.production
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  createbuckets:
    image: minio/mc:latest
    env_file:
      - ./deploy/env.production
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        && mc mb --ignore-existing "local/$$MINIO_BUCKET"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    command: ["run", "--path", "/data", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - chroma-data:/data
    healthcheck:
      # The Chroma image is a Rust binary with bash but no Python/curl/wget.
      test:
        - CMD-SHELL
        - |
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000; printf "GET /api/v2/heartbeat HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n" >&3; head -c 64 <&3 | grep -q 200'
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *app-service
    build:
      <<: *app-build
      target: migrate
    environment:
      ENVIRONMENT: production
      DB_AUTO_MIGRATE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-service
    build:
      <<: *app-build
      target: api
    environment:
      ENVIRONMENT: production
      API_HOST: 0.0.0.0
      DB_AUTO_MIGRATE: "false"
      DOCS_ENABLED: "false"
      TASK_BACKEND: celery
      STORAGE_BACKEND: minio
    volumes:
      - upload-data:/app/upload
    depends_on:
      migrate:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      chroma:
        condition: service_healthy
    stop_grace_period: 30s

  worker-parse:
    <<: *app-service
    build:
      <<: *app-build
      target: worker
    command:
      - celery
      - -A
      - api.celery_app:celery_app
      - worker
      - -Q
      - parse
      - --pool=prefork
      - --concurrency=1
      - --loglevel=INFO
      - --hostname=worker-parse@%h
    environment:
      ENVIRONMENT: production
      TASK_BACKEND: celery
      STORAGE_BACKEND: minio
    volumes:
      - upload-data:/app/upload
    depends_on:
      migrate:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "python -m scripts.worker_healthcheck parse"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    stop_grace_period: 120s

  worker-bid:
    <<: *app-service
    build:
      <<: *app-build
      target: worker
    command:
      - celery
      - -A
      - api.celery_app:celery_app
      - worker
      - -Q
      - bid
      - --pool=prefork
      - --concurrency=1
      - --loglevel=INFO
      - --hostname=worker-bid@%h
    environment:
      ENVIRONMENT: production
      TASK_BACKEND: celery
      STORAGE_BACKEND: minio
    volumes:
      - upload-data:/app/upload
    depends_on:
      migrate:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      chroma:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "python -m scripts.worker_healthcheck bid"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    stop_grace_period: 120s

  nginx:
    build:
      context: .
      target: web
      args:
        # The legacy builder walks every earlier stage for this target, so
        # mirror args must match the API build for cache hits and offline use.
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  postgres-data:
  redis-data:
  minio-data:
  chroma-data:
  upload-data:
