name: much-agents-prod

# Production topology for a single-host internal deployment.
# Only Nginx publishes ports; everything else stays on the private network.
# Required once before `docker compose ... up`:
#   cp deploy/env.production.example deploy/env.production   # then edit
#   ./deploy/nginx/generate-self-signed.sh <host-or-ip>

x-app-env: &app-env
  env_file:
    - ./deploy/env.production

x-app-build: &app-build
  context: .
  args:
    # Optional mirrors for restricted networks; override at build time, e.g.
    #   APT_MIRROR=mirrors.aliyun.com docker compose ... build
    APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
    PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}

x-app-service: &app-service
  env_file:
    - ./deploy/env.production
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=1g,mode=1777
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  postgres:
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    restart: unless-stopped
    env_file:
      - ./deploy/env.production
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    restart: unless-stopped
    env_file:
      - ./deploy/env.production
    command:
      - sh
      - -c
      - >-
        exec redis-server --requirepass "$$REDIS_PASSWORD"
        --appendonly yes --save 60 1
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    env_file:
      - ./deploy/env.production
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  createbuckets:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    env_file:
      - ./deploy/env.production
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        && mc mb --ignore-existing "local/$$MINIO_BUCKET"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  chroma:
    image: chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    restart: unless-stopped
    command: ["run", "--path", "/data", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - chroma-data:/data
    healthcheck:
      # The Chroma image is a Rust binary with bash but no Python/curl/wget.
      test:
        - CMD-SHELL
        - |
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000; printf "GET /api/v2/heartbeat HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n" >&3; head -c 64 <&3 | grep -q 200'
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *app-service
    build:
      <<: *app-build
      target: migrate
    environment:
      ENVIRONMENT: production
      DB_AUTO_MIGRATE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-service
    build:
      <<: *app-build
      target: api
    environment:
      ENVIRONMENT: production
      API_HOST: 0.0.0.0
      DB_AUTO_MIGRATE: "false"
      DOCS_ENABLED: "false"
      TASK_BACKEND: celery
      STORAGE_BACKEND: minio
    volumes:
      - upload-data:/app/upload
      # Admin-only evaluation console reads private labels from the host.
      # Missing or unreadable eval-data degrades to an empty console state.
      - ./eval-data:/app/eval-data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      chroma:
        condition: service_healthy
    stop_grace_period: 30s

  worker-parse:
    <<: *app-service
    build:
      <<: *app-build
      target: worker
    command:
      - celery
      - -A
      - api.celery_app:celery_app
      - worker
      - -Q
      - parse
      - --pool=prefork
      - --concurrency=1
      - --loglevel=INFO
      - --hostname=worker-parse@%h
    environment:
      ENVIRONMENT: production
      TASK_BACKEND: celery
      STORAGE_BACKEND: minio
    volumes:
      - upload-data:/app/upload
    depends_on:
      migrate:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "python -m scripts.worker_healthcheck parse"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    stop_grace_period: 120s

  worker-bid:
    <<: *app-service
    build:
      <<: *app-build
      target: worker
    command:
      - celery
      - -A
      - api.celery_app:celery_app
      - worker
      - -Q
      - bid
      - --pool=prefork
      - --concurrency=1
      - --loglevel=INFO
      - --hostname=worker-bid@%h
    environment:
      ENVIRONMENT: production
      TASK_BACKEND: celery
      STORAGE_BACKEND: minio
    volumes:
      - upload-data:/app/upload
    depends_on:
      migrate:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      chroma:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "python -m scripts.worker_healthcheck bid"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    stop_grace_period: 120s

  worker-maintenance:
    <<: *app-service
    build:
      <<: *app-build
      target: worker
    command:
      - celery
      - -A
      - api.celery_app:celery_app
      - worker
      - -Q
      - maintenance
      - --pool=prefork
      - --concurrency=1
      - --loglevel=INFO
      - --hostname=worker-maintenance@%h
    environment:
      ENVIRONMENT: production
      TASK_BACKEND: celery
      STORAGE_BACKEND: minio
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "python -m scripts.worker_healthcheck maintenance"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    stop_grace_period: 60s

  beat:
    <<: *app-service
    build:
      <<: *app-build
      target: worker
    command:
      - celery
      - -A
      - api.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
    environment:
      ENVIRONMENT: production
      TASK_BACKEND: celery
      STORAGE_BACKEND: minio
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    profiles: ["monitoring"]
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    command:
      - /bin/sh
      - -c
      - |
        printf '%s' "$${METRICS_TOKEN}" > /tmp/metrics_token
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  alertmanager-config:
    image: prom/alertmanager@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    profiles: ["monitoring"]
    # The alertmanager image runs as an unprivileged user, which cannot read
    # the host's 0600 generated config through a bind mount. Copy it into a
    # named volume as 0444; alertmanager mounts that volume read-only.
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        cp /src/alertmanager.yml /config/alertmanager.yml
        chmod 0444 /config/alertmanager.yml
    volumes:
      - ./deploy/alertmanager:/src:ro
      - alertmanager-config:/config
    restart: "no"
    security_opt:
      - no-new-privileges:true

  alertmanager:
    image: prom/alertmanager@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - alertmanager-config:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    depends_on:
      prometheus:
        condition: service_started
      alertmanager-config:
        condition: service_completed_successfully
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana-oss@sha256:a0f881232a6fb71a0554a47d0fe2203b6888fe77f4cefb7ea62bed7eb54e13c3
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  nginx:
    build:
      context: .
      target: web
      args:
        # The legacy builder walks every earlier stage for this target, so
        # mirror args must match the API build for cache hits and offline use.
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        # AGPL-3.0 §13 source offer, baked into the frontend at build time.
        # Modified deployments must point this at their own corresponding source.
        VITE_SOURCE_URL: ${VITE_SOURCE_URL:-https://github.com/lj105183000/much-agents}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  postgres-data:
  redis-data:
  minio-data:
  chroma-data:
  upload-data:
  prometheus-data:
  alertmanager-config:
  alertmanager-data:
  grafana-data:
